[package]
name = "demur"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local CLI for demur, a BYOK code review bot"

[[bin]]
name = "demur"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
demur-core = { path = "../demur-core" }
env_logger = "0.11.11"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
