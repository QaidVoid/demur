name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, cross: false }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, cross: true }
          - { os: macos-latest, target: aarch64-apple-darwin, cross: false }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - name: Install cross-compilation tool
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build release binaries
        working-directory: ${{ github.workspace }}
        run: |
          builder="cargo"
          if [ "${{ matrix.cross }}" = "true" ]; then builder="cross"; fi
          "$builder" build --release --target ${{ matrix.target }} -p demur -p demur-action

      - name: Package artifacts
        run: |
          version="${GITHUB_REF_NAME}"
          out="demur-${version}-${{ matrix.target }}"
          mkdir "$out"
          cp "target/${{ matrix.target }}/release/demur" "$out/"
          cp "target/${{ matrix.target }}/release/demur-action" "$out/"
          tar -czf "$out.tar.gz" "$out"
          sha256sum "$out.tar.gz" > "$out.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            demur-*-${{ matrix.target }}.tar.gz
            demur-*-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            artifacts/*

      # Keep the major version tag pointing at this release so repositories
      # that reference the action at @v0 track it.
      - name: Map the major version tag to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag --force "$major" "${GITHUB_SHA}"
          git push --force origin "refs/tags/$major"
