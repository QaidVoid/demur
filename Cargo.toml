[workspace]
resolver = "2"
members = ["crates/demur-core", "crates/demur", "crates/demur-action"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qaidvoid/review-bot"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
